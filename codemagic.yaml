# ==============================================================================
# Codemagic CI/CD Configuration for Gemini Cascade AI (Android)
# Documentación oficial: https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/
# ==============================================================================

workflows:
  # --------------------------------------------------------------------------
  # 1. FLUJO DE DEPURACIÓN (DEBUG WORKFLOW)
  #    Ideal para pruebas rápidas, pull requests y verificación de compilación.
  # --------------------------------------------------------------------------
  android-debug:
    name: Android Debug Build (APK)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 21
      vars:
        PACKAGE_NAME: "com.aistudio.geminicascade.kdmwpx"
        # Configura GEMINI_API_KEY en Codemagic UI: Environment Variables
        # GEMINI_API_KEY: Encrypted(...)
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
        - pattern: "master"
          include: true
          source: true
        - pattern: "develop"
          include: true
          source: true
    scripts:
      - name: Configurar archivo .env (Secrets Gradle Plugin)
        script: |
          echo "--> Configurando variables de entorno para la compilación..."
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
            echo "✓ Archivo .env generado exitosamente desde GEMINI_API_KEY"
          elif [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            echo "✓ Archivo .env copiado desde .env.example como fallback"
          fi

      - name: Otorgar permisos de ejecución a Gradle Wrapper
        script: |
          chmod +x gradlew

      - name: Compilar APK en modo Debug
        script: |
          echo "--> Ejecutando compilación Debug de la aplicación..."
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/logs/**

    publishing:
      email:
        recipients:
          - mikomikoto038@gmail.com
        notify:
          failure: true
          success: false

  # --------------------------------------------------------------------------
  # 2. FLUJO DE PRODUCCIÓN / LANZAMIENTO (RELEASE WORKFLOW)
  #    Genera APK y Android App Bundle (.aab) firmado para Google Play Store.
  # --------------------------------------------------------------------------
  android-release:
    name: Android Release Build (APK & AAB)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      java: 21
      groups:
        - google_play_credentials # Grupo de variables en la UI de Codemagic (opcional)
      vars:
        PACKAGE_NAME: "com.aistudio.geminicascade.kdmwpx"
        # Variables esperadas por app/build.gradle.kts para signing:
        # KEYSTORE_PATH: Ruta al archivo .jks
        # STORE_PASSWORD: Clave del almacén de claves
        # KEY_PASSWORD: Clave del alias
    triggering:
      events:
        - tag
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
        - pattern: "master"
          include: true
          source: true
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Configurar archivo .env (Secrets Gradle Plugin)
        script: |
          echo "--> Configurando variables de entorno..."
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
            echo "✓ Archivo .env generado desde GEMINI_API_KEY"
          elif [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            echo "✓ Archivo .env copiado desde .env.example"
          fi

      - name: Configurar Keystore de Firma Release
        script: |
          echo "--> Verificando configuración de firma para Release..."
          KEYSTORE_FILE="$CM_BUILD_DIR/my-upload-key.jks"

          # Si se configuró la variable CM_KEYSTORE o RELEASE_KEYSTORE en base64 en Codemagic
          if [ -n "$CM_KEYSTORE" ]; then
            echo "Decodificando CM_KEYSTORE desde variable de entorno..."
            echo "$CM_KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"
            export KEYSTORE_PATH="$KEYSTORE_FILE"
            export STORE_PASSWORD="${CM_KEYSTORE_PASSWORD:-$STORE_PASSWORD}"
            export KEY_PASSWORD="${CM_KEY_PASSWORD:-$KEY_PASSWORD}"
          elif [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decodificando KEYSTORE_BASE64 desde variable de entorno..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            export KEYSTORE_PATH="$KEYSTORE_FILE"
          elif [ -f "$CM_BUILD_DIR/debug.keystore.base64" ] && [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Usando debug.keystore.base64 como firma provisional para pruebas de release..."
            base64 --decode "$CM_BUILD_DIR/debug.keystore.base64" > "$KEYSTORE_FILE" || true
            export KEYSTORE_PATH="$KEYSTORE_FILE"
            export STORE_PASSWORD="android"
            export KEY_PASSWORD="android"
          fi

          echo "KEYSTORE_PATH: ${KEYSTORE_PATH:-no configurado}"

      - name: Otorgar permisos de ejecución a Gradle Wrapper
        script: |
          chmod +x gradlew

      - name: Compilar Release App Bundle (AAB) y APK
        script: |
          echo "--> Compilando bundleRelease (AAB)..."
          ./gradlew :app:bundleRelease --no-daemon --no-configuration-cache --stacktrace || true

          echo "--> Compilando assembleRelease (APK)..."
          ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace || {
            echo "Firma no completada para release; generando assembleDebug como respaldo..."
            ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace
          }

    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/mapping/**/mapping.txt

    publishing:
      email:
        recipients:
          - mikomikoto038@gmail.com
        notify:
          failure: true
          success: true

      # Para habilitar publicación automática a Google Play Store:
      # 1. Configura la clave JSON de la cuenta de servicio en Codemagic UI:
      #    GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      # 2. Descomenta la sección a continuación:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal # o 'alpha', 'beta', 'production'
      #   in_app_update_priority: 0

name: Android Build & APK Generation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment File
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          elif [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      # ----------------------------------------------------
      # Seccion de pruebas unitarias (deshabilitada/comentada)
      # ----------------------------------------------------
      # - name: Run Unit Tests
      #   run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Android APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Si se configuró el keystore en los Secrets de GitHub, decodificarlo y compilar Release firmado
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "==> Configurando firma con Keystore de producción (Release)..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            gradle :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace
            mkdir -p release-output
            cp app/build/outputs/apk/release/*.apk release-output/ || true
          else
            echo "==> Generando APK firmado automáticamente (Debug APK firmado listo para instalar)..."
            gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: |
            app/build/outputs/apk/debug/
            app/build/outputs/apk/release/
          retention-days: 14
